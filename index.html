<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <title>Náhled knižních novinek</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      padding: 40px 20px;
      margin: 0;
    }

    .novinky-sekce {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #c8102e; 
      border-bottom: 2px solid #c8102e;
      padding-bottom: 10px;
    }

    /* Obal celého slideru včetně tlačítek */
    .slider-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    /* Kontejner s kartami */
    .slider-container {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 15px 5px;
      scrollbar-width: none; /* Firefox */
      width: 100%;
      -webkit-overflow-scrolling: touch; /* Plynulý posun na iOS */
    }

    .slider-container::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Edge */
    }

    /* Výrazná červená tlačítka pro posun */
    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      background: #c8102e;
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      user-select: none;
      transition: background-color 0.2s, transform 0.2s;
    }

    .slider-btn:hover {
      background: #a00c24;
      transform: translateY(-50%) scale(1.08);
    }

    .slider-btn.prev {
      left: -15px;
    }

    .slider-btn.next {
      right: -15px;
    }

    /* Karty knih */
    .kniha-karta {
      flex: 0 0 180px;
      width: 180px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .kniha-karta:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }

    .kniha-karta img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 10px;
      display: block;
    }

    .no-cover {
      width: 100%;
      height: 210px;
      background: #f8fafc;
      color: #64748b;
      border: 2px dashed #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 0.8em;
      font-weight: bold;
      box-sizing: border-box;
    }

    .no-cover svg {
      width: 36px;
      height: 36px;
      fill: #c8102e;
      margin-bottom: 8px;
      opacity: 0.8;
    }

    .kniha-nazev {
      font-weight: bold;
      font-size: 0.85em;
      color: #c8102e;
      margin-bottom: 6px;
      line-height: 1.3;
      height: 2.6em;
      overflow: hidden;
      text-decoration: none;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .kniha-autor {
      font-size: 0.78em;
      color: #64748b;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kniha-btn {
      display: block;
      padding: 8px 10px;
      background-color: #c8102e;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.8em;
      font-weight: bold;
      transition: background 0.2s;
      width: 100%;
      box-sizing: border-box;
    }

    .kniha-btn:hover {
      background-color: #a00c24;
    }
  </style>
</head>
<body>

<div class="novinky-sekce">
  <h2></h2>
  
  <div class="slider-wrapper">
    <button class="slider-btn prev" onclick="posunoutLeft()" aria-label="Posunout vlevo">&#10094;</button>
    
    <div class="slider-container" id="knizni-novinky-container">
      <p>Načítám novinky z katalogu...</p>
    </div>

    <button class="slider-btn next" onclick="posunoutRight()" aria-label="Posunout vpravo">&#10095;</button>
  </div>
</div>

<script>
  // 1. Pomocná funkce pro vytvoření náhradního obalu (umístěná na začátku)
  function vytvorNahradniObal() {
    const box = document.createElement("div");
    box.className = "no-cover";
    box.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>Bez obálky';
    return box;
  }

  // 2. Globální funkce pro posun tlačítek
  function posunoutLeft() {
    const container = document.getElementById("knizni-novinky-container");
    if (container) {
      container.scrollBy({ left: -585, behavior: 'smooth' });
    }
  }

  function posunoutRight() {
    const container = document.getElementById("knizni-novinky-container");
    if (container) {
      container.scrollBy({ left: 585, behavior: 'smooth' });
    }
  }

  // 3. Hlavní logika načítání dat
  const siglaKnihovny = "CBD007";
  const container = document.getElementById("knizni-novinky-container");
  const apiUrl = "https://api-eu.hosted.exlibrisgroup.com/primo/v1/search?vid=420CARDS_JCU:JCU&tab=LibraryCatalog&scope=MyInstitution&q=rtype,exact,books&qInclude=facet_tlevel,exact,available_p&sort=date_d&limit=25&apikey=l8xxdfc91b34d2d14347b8d88b1346bcc795";

  fetch(apiUrl)
    .then(response => response.json())
    .then(data => {
      container.innerHTML = "";

      if (!data.docs || data.docs.length === 0) {
        container.innerHTML = "<p>Nebyly nalezeny žádné nové knihy.</p>";
        return;
      }

      data.docs.forEach(doc => {
        const isOnline = doc.pnx.delivery && doc.pnx.delivery.delcategory && doc.pnx.delivery.delcategory.includes("Online Resource");
        if (isOnline) return;

        const title = doc.pnx.display.title ? doc.pnx.display.title[0] : "Bez názvu";
        const author = doc.pnx.display.creator ? doc.pnx.display.creator[0].replace(/\$\$Q.*/, '') : "";
        
        let docId = doc.pnx.control.recordid ? doc.pnx.control.recordid[0] : "";
        if (doc.pnx.control.sourcerecordid) {
          docId = "alma" + doc.pnx.control.sourcerecordid[0];
        }
        const catalogUrl = "https://discovery.jcu.cz/nde/fulldisplay?docid=" + docId + "&tab=LibraryCatalog&search_scope=MyInstitution&vid=420CARDS_JCU:JCU&lang=cs";

        let isbn = "";
        if (doc.pnx.addata && doc.pnx.addata.isbn) {
          isbn = doc.pnx.addata.isbn[0].replace(/[^0-9X]/gi, '');
        }

        const karta = document.createElement("div");
        karta.className = "kniha-karta";

        const wrapLink = document.createElement("a");
        wrapLink.href = catalogUrl;
        wrapLink.target = "_blank";
        wrapLink.style.textDecoration = "none";

        if (isbn) {
          const img = document.createElement("img");
          img.src = "https://cache.obalkyknih.cz/api/cover?isbn=" + isbn + "&library_id=" + siglaKnihovny;
          img.alt = title;
          
          img.onerror = function() {
            this.onerror = function() {
              this.replaceWith(vytvorNahradniObal());
            };
            this.src = "https://covers.openlibrary.org/b/isbn/" + isbn + "-M.jpg?default=false";
          };
          
          wrapLink.appendChild(img);
        } else {
          wrapLink.appendChild(vytvorNahradniObal());
        }

        const nazevDiv = document.createElement("div");
        nazevDiv.className = "kniha-nazev";
        nazevDiv.title = title;
        nazevDiv.textContent = title;
        wrapLink.appendChild(nazevDiv);

        const autorDiv = document.createElement("div");
        autorDiv.className = "kniha-autor";
        autorDiv.textContent = author;

        const btnLink = document.createElement("a");
        btnLink.href = catalogUrl;
        btnLink.target = "_blank";
        btnLink.className = "kniha-btn";
        btnLink.textContent = "Detail v katalogu";

        karta.appendChild(wrapLink);
        karta.appendChild(autorDiv);
        karta.appendChild(btnLink);

        container.appendChild(karta);
      });
    })
    .catch(error => {
      console.error("Chyba:", error);
      container.innerHTML = "<p>Chyba při načítání dat z API.</p>";
    });
</script>

</body>
</html>
