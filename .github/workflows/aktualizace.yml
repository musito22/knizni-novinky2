name: Automatická aktualizace novinek

on:
  schedule:
    - cron: '0 2 * * *'  # Každý den ve 2:00 ráno
  workflow_dispatch:      # Umožní ruční spuštění

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Načíst kód
        uses: actions/checkout@v3

      - name: Nastavit Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Spustit generování novinek
        env:
          ALMA_API_KEY: ${{ secrets.ALMA_API_KEY }}
        run: python generuj_novinky.py

      - name: Uložit změny na GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add novinky.json
          git commit -m "Automatická aktualizace knižních novinek" || exit 0
          git push
